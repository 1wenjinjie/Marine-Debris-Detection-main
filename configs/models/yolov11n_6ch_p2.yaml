# YOLOv11n-6ch-P2
# Innovation Model for Marine Debris Detection
# Features:
# 1. 6-Channel Input (Multispectral)
# 2. P2 Head (High Resolution for Small Objects) - Adds a 4th detection scale at stride 4.

# Parameters
ch: 6
nc: 3
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4 (Low level features)

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 (Cat P4)
  - [-1, 2, C3k2, [512, False]] # 13

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 (Cat P3)
  - [-1, 2, C3k2, [256, False]] # 16

  # P3 -> P2 (New High-Res Layer)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 (Cat P2)
  - [-1, 2, C3k2, [128, False]] # 19 (P2 Output)

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 (Cat P3-Neck)
  - [-1, 2, C3k2, [256, False]] # 22 (P3 Output)

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 (Cat P4-Neck)
  - [-1, 2, C3k2, [512, False]] # 25 (P4 Output)

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 (Cat P5-Backbone)
  - [-1, 2, C3k2, [1024, True]] # 28 (P5 Output)

  # Detect [P2, P3, P4, P5]
  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29
