# YOLOv11n-6ch-P2-CBAM
# Innovation Model for Marine Debris Detection
# Features:
# 1. 6-Channel Input (Multispectral)
# 2. P2 Head (High Resolution for Small Objects)
# 3. CBAM Attention (Channel & Spatial Attention for Spectral Feature Enhancement)

# Parameters
ch: 6
nc: 3
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, CBAM, [256, 7]] # 3-P2 Attention (Explicit c1=256)

  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5-P3/8
  - [-1, 1, CBAM, [512, 7]] # 6-P3 Attention (Explicit c1=512)

  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8-P4/16
  - [-1, 1, CBAM, [512, 7]] # 9-P4 Attention (Explicit c1=512)

  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]] # 11-P5/32
  - [-1, 1, CBAM, [1024, 7]] # 12-P5 Attention (Explicit c1=1024)
  - [-1, 1, SPPF, [1024, 5]] # 13
  - [-1, 2, C2PSA, [1024]] # 14

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 9], 1, Concat, [1]] # 16 (Cat P4-Attn)
  - [-1, 2, C3k2, [512, False]] # 17

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 6], 1, Concat, [1]] # 19 (Cat P3-Attn)
  - [-1, 2, C3k2, [256, False]] # 20

  # P3 -> P2 (New High-Res Layer for Small Objects)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [[-1, 3], 1, Concat, [1]] # 22 (Cat P2-Attn)
  - [-1, 2, C3k2, [128, False]] # 23 (P2 Output)

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]] # 24
  - [[-1, 20], 1, Concat, [1]] # 25 (Cat P3-Neck)
  - [-1, 2, C3k2, [256, False]] # 26 (P3 Output)

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [[-1, 17], 1, Concat, [1]] # 28 (Cat P4-Neck)
  - [-1, 2, C3k2, [512, False]] # 29 (P4 Output)

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]] # 30
  - [[-1, 14], 1, Concat, [1]] # 31 (Cat P5-Backbone)
  - [-1, 2, C3k2, [1024, True]] # 32 (P5 Output)

  # Detect [P2, P3, P4, P5]
  - [[23, 26, 29, 32], 1, Detect, [nc]] # 33
