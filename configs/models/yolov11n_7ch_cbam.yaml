# YOLOv11n for MARIDA v1 7ch (physidx) - 7 channels, 7 classes, +CBAM
# Pure CBAM ablation: only difference vs yolov11n_7ch.yaml is CBAM
# inserted after each backbone C3k2 output (4 scales: P2/P3/P4/P5).
# Detect head remains P3/P4/P5 (no P2 head, no neck change).
#
# IMPORTANT: parse_model does NOT auto-scale CBAM's c1, so the values below
# are pre-computed for scale=n (width=0.25, max_channels=1024).
# If you switch to scale s/m/l, recompute:
#   c1_actual = make_divisible(min(c1_nominal, max_channels) * width, 8)
# Nominal -> n-actual: 256->64, 512->128, 1024->256
ch: 7
nc: 7
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0  P1/2          (out: 16)
  - [-1, 1, Conv, [128, 3, 2]]                 # 1  P2/4          (out: 32)
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2  P2/4 features (out: 64)
  - [-1, 1, CBAM, [64, 7]]                     # 3  P2 attention  (in: 64)
  - [-1, 1, Conv, [256, 3, 2]]                 # 4  P3/8          (out: 64)
  - [-1, 2, C3k2, [512, False, 0.25]]          # 5  P3/8 features (out: 128)
  - [-1, 1, CBAM, [128, 7]]                    # 6  P3 attn       (in: 128)  P3 detect source
  - [-1, 1, Conv, [512, 3, 2]]                 # 7  P4/16         (out: 128)
  - [-1, 2, C3k2, [512, True]]                 # 8  P4/16 features (out: 128)
  - [-1, 1, CBAM, [128, 7]]                    # 9  P4 attn       (in: 128)  P4 detect source
  - [-1, 1, Conv, [1024, 3, 2]]                # 10 P5/32         (out: 256)
  - [-1, 2, C3k2, [1024, True]]                # 11 P5/32 features (out: 256)
  - [-1, 1, CBAM, [256, 7]]                    # 12 P5 attn       (in: 256)
  - [-1, 1, SPPF, [1024, 5]]                   # 13               (out: 256)
  - [-1, 2, C2PSA, [1024]]                     # 14               (out: 256)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 9], 1, Concat, [1]]                  # 16 cat P4-attn
  - [-1, 2, C3k2, [512, False]]                # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 6], 1, Concat, [1]]                  # 19 cat P3-attn
  - [-1, 2, C3k2, [256, False]]                # 20  P3/8 detect output

  - [-1, 1, Conv, [256, 3, 2]]                 # 21
  - [[-1, 17], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [512, False]]                # 23  P4/16 detect output

  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 14], 1, Concat, [1]]                 # 25
  - [-1, 2, C3k2, [1024, True]]                # 26  P5/32 detect output

  - [[20, 23, 26], 1, Detect, [nc]]            # 27
