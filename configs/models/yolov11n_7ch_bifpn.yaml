# YOLOv11n for MARIDA v1 7ch (physidx) - 7 channels, 7 classes, +BiFPN-lite
# Pure BiFPN-lite ablation: same backbone and Detect head scale set as
# yolov11n_7ch.yaml; PAN Concat nodes are replaced by learnable weighted
# fusion, and the bottom-up P4 node receives an extra same-scale P4 skip.
#
# IMPORTANT: this YAML requires:
#   from ultralytics_plugins.bifpn_modules import install_bifpn_patch
#   install_bifpn_patch()
# before constructing the Ultralytics model.
ch: 7
nc: 7
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]   # P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]           # P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]               # P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, WeightedConcat, [1, 2]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, WeightedConcat, [1, 2]]
  - [-1, 2, C3k2, [256, False]]          # 16 (P3/8)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13, 6], 1, WeightedConcat, [1, 3]]
  - [-1, 2, C3k2, [512, False]]          # 19 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, WeightedConcat, [1, 2]]
  - [-1, 2, C3k2, [1024, True]]          # 22 (P5/32)
  - [[16, 19, 22], 1, Detect, [nc]]
