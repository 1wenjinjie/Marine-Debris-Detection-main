# v1 7ch tiles with PHYSICAL 7th channel (NDWI inverse), on v2 scene-clean split.
#
# Difference from marida_v1_on_v2split_7ch.yaml:
# - 7th channel is (1 - NDWI) / 2 = (1 - (B3-B8)/(B3+B8)) / 2
# - Computed deterministically from spectral bands. No GT dependence.
# - Floating objects (debris, algae) have NIR > Green => high prior value.
# - Pure water => prior ~0.
#
# Use this to quantify how a PHYSICAL prior compares to (a) GT oracle and
# (b) no prior. See docs/paper/7CH_BASELINE_CURRENT_AUDIT_2026-05-18.md.

